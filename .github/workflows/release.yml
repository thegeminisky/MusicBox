name: Build Release APK

# Tag a version to publish a Release:
#   git tag v1.1.3 && git push origin v1.1.3
# The APK is built on GitHub and attached to the Release page; binaries never
# enter the repository, so every change stays exactly one commit.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, e.g. 1.1.3 (leave empty to compute from version.config)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest ships with an Android SDK; setup-android@v3 fails on
      # cmdline-tools 16 because the legacy "tools" package no longer exists.
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout (full history for PATCH counting)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install platform and build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"
          ls "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          ls "$ANDROID_HOME/platforms/android-34/android.jar"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not configured. See README (Release)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            V="$INPUT_VERSION"
          else
            V="${REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${V:-<auto from version.config>}"

      - name: Build APK
        env:
          MB_VERSION_NAME: ${{ steps.ver.outputs.version }}
          KS_PATH: ${{ runner.temp }}/release.keystore
          KS_PASS: ${{ secrets.KS_PASSWORD }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: bash scripts/build.sh

      - name: Upload artifact (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: musicbox-apk
          path: dist/musicbox.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MusicBox ${{ steps.ver.outputs.version }}
          files: dist/musicbox.apk
          generate_release_notes: true
